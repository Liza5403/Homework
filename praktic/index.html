<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Стилизация формы</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/normalize.css" />
  </head>
  <body>
    <form class="form">
      <fieldset class="form-group">
        <legend class="form-group-title">Ваши личные данные</legend>
        <label class="label"> Ваше имя</label>
        <input
          class="input"
          type="name"
          placeholder="Имя"
          name="name"
          required
        />

        <label class="label"> Ваш возраст </label>
        <input
          id="age"
          class="input"
          type="number"
          placeholder="Возраст"
          name="number"
          required
        />

        <label class="label"> Ваш номер телефона </label>
        <input
          class="input"
          type="tel"
          placeholder="Номер телефона"
          name="tel"
          required
        />

        <label class="label"> Ваша почта </label>
        <input
          class="input"
          type="email"
          placeholder="Почта"
          name="email"
          required
        />

        <label class="label"> Сообщение</label>
        <textarea
          class="textarea"
          class="input"
          name="text"
          placeholder="Ваше сообщение"
          required
        >
        </textarea>
      </fieldset>
      <fieldset class="form-group">
        <label class="label label-checkbox">
          <input type="checkbox" class="checkbox" name="checkbox" required />
          <span class="checkbox-text">Я принимаю правила</span>
        </label>
      </fieldset>
      <button class="button">Отправить</button>
    </form>
  </body>
</html>
